name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base: ['/', '/astro-theme-ink/']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        if: matrix.base == '/'
        run: pnpm test

      - name: Type-check & build
        run: pnpm build
        env:
          BASE_PATH: ${{ matrix.base }}

      - name: Check built links and images
        run: pnpm check:links
